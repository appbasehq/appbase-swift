name: Swift package build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build Swift package for macOS
        run: swift build -c release
      - name: Build Swift package for the iOS simulator
        run: xcodebuild -scheme AppbaseAnalytics -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/appbase-swift-ios" CODE_SIGNING_ALLOWED=NO build
